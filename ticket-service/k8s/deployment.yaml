apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service-container
          image: ticket-service:v4
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 8502
          envFrom:
            - configMapRef:
                name: ticket-service-config
            - secretRef:
                name: ticket-service-secret
          env:
            - name: SERVER_PORT
              value: "8502"
          resources:
            requests:
              cpu: "250m"      
              memory: "256Mi"
            limits:
              cpu: "500m"      
              memory: "512Mi"    