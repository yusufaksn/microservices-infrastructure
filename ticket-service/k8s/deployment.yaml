apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      hostAliases:
        - ip: "192.168.49.2"
          hostnames:
            - "auth.test"
            - "apigateway.test"
      containers:
        - name: ticket-service-container
          image: ysfaksn/ticket-service:cd4de26ea204038a3cc0d191a2cde6b3d1d3581f
          imagePullPolicy: Always
          ports:
            - containerPort: 8502
          envFrom:
            - configMapRef:
                name: ticket-service-config
            - secretRef:
                name: ticket-service-secret
          env:
            - name: SERVER_PORT
              value: "8502"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"