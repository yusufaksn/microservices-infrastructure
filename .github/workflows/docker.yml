name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Gateway 
      # -----------------------------
      - name: Build & Package Gateway
        working-directory: gateway
        run: |
          mvn clean package -DskipTests
          docker build -t ysfaksn/api-gateway:latest .

      - name: Push Gateway
        run: docker push ysfaksn/api-gateway:latest

      # -----------------------------
      # Ticket Service
      # -----------------------------
      - name: Test, Build & Package Ticket Service
        working-directory: ticket-service
        run: |
          mvn clean package
          docker build -t ysfaksn/ticket-service:latest .

      - name: Push Ticket Service
        run: docker push ysfaksn/ticket-service:latest

      # -----------------------------
      # Notification Service
      # -----------------------------
      - name: Test, Build & Package Notification Service
        working-directory: notification-service
        run: |
          mvn clean package
          docker build -t ysfaksn/notification-service:latest .

      - name: Push Notification Service
        run: docker push ysfaksn/notification-service:latest