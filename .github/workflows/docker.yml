name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ticketdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Gateway 
      # -----------------------------
      - name: Build & Package Gateway
        working-directory: gateway
        run: |
          mvn clean package -DskipTests
          docker build -t ysfaksn/api-gateway:latest .

      - name: Push Gateway
        run: docker push ysfaksn/api-gateway:latest

      # -----------------------------
      # Ticket Service
      # -----------------------------
      - name: Initialize test database schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -p 5432 -U test -d ticketdb -f ticket-service/db-init/schema.sql

      - name: Test, Build & Package Ticket Service
        working-directory: ticket-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ticketdb
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: |
          mvn clean package
          docker build -t ysfaksn/ticket-service:latest .

      - name: Push Ticket Service
        run: docker push ysfaksn/ticket-service:latest

      # -----------------------------
      # Notification Service
      # -----------------------------
      - name: Test, Build & Package Notification Service
        working-directory: notification-service
        run: |
          mvn clean package
          docker build -t ysfaksn/notification-service:latest .

      - name: Push Notification Service
        run: docker push ysfaksn/notification-service:latest

      # -----------------------------
      # Ticket Service Query
      # -----------------------------
      - name: Test, Build & Package Ticket Service Query
        working-directory: ticket-service-query
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ticketdb
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: |
          mvn clean package
          docker build -t ysfaksn/ticket-service-query:latest .

      - name: Push Ticket Service Query
        run: docker push ysfaksn/ticket-service-query:latest

      # -----------------------------
      # Ticket Search Service
      # -----------------------------
      - name: Build & Package Ticket Search Service
        working-directory: ticket-search-service
        run: |
          mvn clean package -DskipTests
          docker build -t ysfaksn/ticket-service-search:latest .

      - name: Push Ticket Search Service
        run: docker push ysfaksn/ticket-service-search:latest